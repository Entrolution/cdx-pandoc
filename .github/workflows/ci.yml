name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  # A new push to the same PR or branch supersedes the run in flight. Without
  # this every push queued a *fresh* full set of jobs alongside the old ones,
  # so a branch pushed five times held five complete matrices at once — on
  # paid Blacksmith runners, and with nothing reclaiming the superseded work.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: blacksmith-2vcpu-ubuntu-2404
    # Capped because the GitHub default is **six hours** per job, and this
    # workflow is reachable from a fork pull request. Measured over the last
    # six runs the slowest job here is 21s, so 20 minutes is roughly 57x
    # headroom while removing the runaway: a stuck or hostile job now costs
    # 20 minutes of a paid runner rather than a working day of one.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua and Luarocks
        run: sudo apt-get update && sudo apt-get install -y lua5.4 luarocks

      - name: Install luacheck
        run: sudo luarocks install luacheck

      - name: Run luacheck
        run: luacheck . --no-unused-args --no-max-line-length

  test:
    name: Test
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.4

      - name: Install Pandoc
        run: |
          wget https://github.com/jgm/pandoc/releases/download/3.1.11/pandoc-3.1.11-1-amd64.deb
          sudo dpkg -i pandoc-3.1.11-1-amd64.deb

      - name: Verify Pandoc installation
        run: pandoc --version

      - name: Run writer tests
        run: make test

      - name: Validate JSON structure
        run: make validate

      - name: Compare against golden baselines
        run: make test-golden

      - name: Run reader round-trip tests
        run: make test-reader
